  <!-- Set the theme before first paint: saved choice, else the system setting. Keep in sync with ThemeService. -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('sayit-theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var root = document.documentElement;
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-bs-theme', theme);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#1b1917' : '#f5ead8');
    })();
  </script>
