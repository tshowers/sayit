<div class="auth-gate-overlay" data-cy="auth-gate" role="dialog" aria-modal="true">
    <div class="auth-gate-card auth-gate-card--with-visual">
        <div class="auth-gate-visual d-none d-lg-flex" aria-hidden="true">
            <div class="auth-gate-visual-inner">
                <img class="auth-gate-visual-art" src="assets/sayit/sayit-brand.png" alt="" loading="eager" />
            </div>
        </div>
        <div class="auth-gate-content auth-gate-content--form-only">
            <div class="auth-gate-header">
                <div class="auth-gate-branding">
                    <div class="auth-gate-brand-stack">
                        <img class="auth-gate-logo" src="assets/sayit/sayit-logo.png" alt="Say It" />
                        <div class="auth-gate-title-group">
                            <div class="auth-gate-eyebrow">Say It</div>
                            <div class="auth-gate-title">Sign in to continue</div>
                        </div>
                    </div>
                </div>
                <button *ngIf="dismissible" type="button" class="auth-gate-close" (click)="close()" aria-label="Close"> × </button>
            </div>
            <div class="auth-gate-body">
                <p class="auth-gate-subtext">Enter your email. We’ll send a secure sign-in link.</p>
                <div class="form-group">
                    <label for="authGateEmail">Email</label>
                    <input id="authGateEmail" class="form-control" type="email" placeholder="name@company.com" [(ngModel)]="email" (keyup.enter)="sendLink()" [disabled]="busy" />
                </div>
                <div class="auth-gate-actions">
                    <button type="button" class="btn btn-todd" (click)="sendLink()" [disabled]="busy || !isValidEmail(email)">
                        {{ busy ? 'Sending…' : 'Send sign-in link' }}
                    </button>
                    <div class="auth-gate-divider" aria-hidden="true">OR</div>
                    <button type="button" class="btn btn-todd btn-todd-google" (click)="signInWithGoogle()" [disabled]="busy">
                        <i class="fa-brands fa-google me-2"></i> Continue with Google </button>
                </div>
                <div *ngIf="successMessage" class="alert alert-light system-theme-alert auth-gate-alert">
                    <i class="fa fa-check-circle me-2"></i>
                    {{ successMessage }}
                </div>
                <div *ngIf="errorMessage" class="alert alert-danger auth-gate-alert">
                    <i class="fa fa-exclamation-triangle me-2"></i>
                    {{ errorMessage }}
                </div>
                <div class="auth-gate-footnote text-muted">If you don’t see the email, check spam.</div>
            </div>
        </div>
    </div>
</div>
